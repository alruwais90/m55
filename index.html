<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>مصاريف المنزل</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f4f7f7;--card:#fff;--line:#d8e0e0;--text:#172222;--muted:#647272;
  --accent:#0f766e;--select:#e6f4f1;--danger:#b42318;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text)}
.app{max-width:920px;margin:auto;padding:14px 12px 40px}
h1{font-size:22px;margin:4px 0 14px;text-align:center}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.card label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.card input,.value{width:100%;font-size:18px;font-weight:700;border:0;background:transparent;outline:0;direction:ltr;text-align:center}
.value.negative{color:var(--danger)}
.toolbar{display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.secondary{background:#e8eeee;color:#172222}
.danger{background:#fee4e2;color:#912018}
.head,.row{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1.35fr) 120px;gap:6px;align-items:center}
.head{padding:0 4px 6px;font-size:12px;color:var(--muted)}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:6px}
.row.selected{background:var(--select);outline:2px solid var(--accent)}
.num{width:32px;height:32px;border-radius:9px;background:#eef3f3;display:flex;align-items:center;justify-content:center;font-weight:800;user-select:none}
.row input{width:100%;min-width:0;border:1px solid #e3e8e8;border-radius:9px;padding:9px 8px;font-size:14px;background:#fff}
.amount{direction:ltr;text-align:left}
.note{font-size:12px;color:var(--muted);text-align:center;margin:10px 0}
@media(max-width:650px){
  .summary{grid-template-columns:1fr 1fr}
  .summary .remain{grid-column:1/-1}
  .head,.row{grid-template-columns:34px 1fr 1.15fr 92px}
  .row input{font-size:13px;padding:8px 6px}
  h1{font-size:20px}
}
@media print{
  body{background:#fff}
  .app>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
#printArea{display:none}
</style>
</head>
<body>
<div class="app">
  <h1>مصاريف المنزل</h1>

  <div class="summary">
    <div class="card">
      <label>المبلغ الشهري</label>
      <input id="monthly" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
    </div>
    <div class="card">
      <label>مجموع المشتريات</label>
      <div id="purchases" class="value">0.00</div>
    </div>
    <div class="card remain">
      <label>المتبقي</label>
      <div id="remaining" class="value">0.00</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="primary" id="printBtn">PDF / طباعة المحدد</button>
    <button class="danger" id="resetBtn">حذف وتصفير العدادات</button>
  </div>

  <div class="head">
    <div></div><div>البائع</div><div>البيان</div><div>المبلغ</div>
  </div>
  <div id="rows"></div>
  <div class="note">اضغط رقم الصف لتحديده للطباعة. إذا لم تحدد صفوفًا، تُطبع جميع الصفوف التي تحتوي بيانات.</div>

  <div id="printArea"></div>
</div>

<script>
const KEY='houseExpensesV1';
const rowsHost=document.getElementById('rows');
const monthly=document.getElementById('monthly');
const purchases=document.getElementById('purchases');
const remaining=document.getElementById('remaining');
const printArea=document.getElementById('printArea');

const fmt=n=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const num=v=>{const x=parseFloat(v);return Number.isFinite(x)?x:0};

function build(){
  for(let i=100;i>=1;i--){
    const row=document.createElement('div');
    row.className='row';
    row.dataset.n=i;
    row.dataset.selected='0';
    row.innerHTML=`
      <div class="num" title="تحديد للطباعة">${i}</div>
      <input class="seller" placeholder="البائع">
      <input class="desc" placeholder="البيان">
      <input class="amount" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
    `;
    rowsHost.appendChild(row);
  }
}
function snapshot(){
  return {
    monthly:monthly.value,
    rows:[...rowsHost.children].map(r=>({
      n:r.dataset.n,
      seller:r.querySelector('.seller').value,
      desc:r.querySelector('.desc').value,
      amount:r.querySelector('.amount').value
    }))
  };
}
function save(){
  localStorage.setItem(KEY,JSON.stringify(snapshot()));
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!d)return;
    monthly.value=d.monthly||'';
    const map=new Map((d.rows||[]).map(x=>[String(x.n),x]));
    [...rowsHost.children].forEach(r=>{
      const x=map.get(r.dataset.n); if(!x)return;
      r.querySelector('.seller').value=x.seller||'';
      r.querySelector('.desc').value=x.desc||'';
      r.querySelector('.amount').value=x.amount||'';
    });
  }catch(e){}
}
function recalc(){
  const total=[...document.querySelectorAll('.amount')].reduce((s,i)=>s+num(i.value),0);
  purchases.textContent=fmt(total);
  const rem=num(monthly.value)-total;
  remaining.textContent=fmt(rem);
  remaining.classList.toggle('negative',rem<0);
  save();
}
rowsHost.addEventListener('input',recalc);
monthly.addEventListener('input',recalc);

rowsHost.addEventListener('click',e=>{
  const n=e.target.closest('.num');
  if(!n)return;
  const r=n.closest('.row');
  const on=r.dataset.selected!=='1';
  r.dataset.selected=on?'1':'0';
  r.classList.toggle('selected',on);
});

document.getElementById('resetBtn').addEventListener('click',()=>{
  if(!confirm('سيتم حذف جميع البيانات وتصفير العدادات. هل أنت متأكد؟'))return;
  monthly.value='';
  [...rowsHost.children].forEach(r=>{
    r.querySelector('.seller').value='';
    r.querySelector('.desc').value='';
    r.querySelector('.amount').value='';
    r.dataset.selected='0';
    r.classList.remove('selected');
  });
  localStorage.removeItem(KEY);
  recalc();
});

document.getElementById('printBtn').addEventListener('click',()=>{
  const all=[...rowsHost.children].map(r=>({
    n:r.dataset.n,
    seller:r.querySelector('.seller').value.trim(),
    desc:r.querySelector('.desc').value.trim(),
    amount:num(r.querySelector('.amount').value),
    selected:r.dataset.selected==='1'
  })).filter(x=>x.seller||x.desc||x.amount>0);
  const selected=all.filter(x=>x.selected);
  const items=selected.length?selected:all;
  const total=items.reduce((s,x)=>s+x.amount,0);
  const monthlyValue=num(monthly.value);
  const remainderValue=monthlyValue-total;
  const today=new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date());

  const rowsHtml=items.map(x=>`
    <tr>
      <td>${x.n}</td><td>${x.seller||''}</td><td>${x.desc||''}</td><td>${fmt(x.amount)}</td>
    </tr>`).join('');

  printArea.innerHTML=`
    <div dir="rtl" style="font-family:Arial,Tahoma,sans-serif;padding:18px;color:#111">
      <h2 style="margin:0 0 5px">مصاريف المنزل</h2>
      <div style="font-size:12px;color:#666;margin-bottom:14px">${today}</div>
      <table style="width:100%;border-collapse:collapse;margin-bottom:15px;font-size:13px">
        <tr><td style="border:1px solid #aaa;padding:6px">المبلغ الشهري</td><td style="border:1px solid #aaa;padding:6px">${fmt(monthlyValue)}</td></tr>
        <tr><td style="border:1px solid #aaa;padding:6px">مجموع المشتريات المحددة</td><td style="border:1px solid #aaa;padding:6px">${fmt(total)}</td></tr>
        <tr><td style="border:1px solid #aaa;padding:6px">المتبقي</td><td style="border:1px solid #aaa;padding:6px">${fmt(remainderValue)}</td></tr>
      </table>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr>
          <th style="border:1px solid #aaa;padding:6px">#</th>
          <th style="border:1px solid #aaa;padding:6px">البائع</th>
          <th style="border:1px solid #aaa;padding:6px">البيان</th>
          <th style="border:1px solid #aaa;padding:6px">المبلغ</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
  window.print();
});

build(); load(); recalc();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
